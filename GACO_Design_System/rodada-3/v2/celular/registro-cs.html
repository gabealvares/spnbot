<style>
.cel{padding:12px 16px 24px;max-width:600px;margin:0 auto}
.cel h1{font-size:20px;line-height:26px;font-weight:700;margin:4px 0 10px}
.cel h2{font-size:15px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px}

<body>
<a class="cm-pular" href="#conteudo">Pular para o conteúdo</a>
<div data-moldura='{"grupo": "CS", "tela": "Clientes", "papel": "CS", "trilha": false, "sino": 2, "usuario": {"nome": "Rafael Menezes", "iniciais": "RM", "cargo": "CS", "presenca": "disponivel", "tom": 4}}'></div>
<main id="conteudo">
<div class="cel"><p class="cm-t-legenda">Cond. Parque das Águas</p><h1>Registrar contato</h1>
<div class="cm-opcoes-botao" role="group" aria-label="Tipo de contato"><button type="button" aria-pressed="true"><i data-i="telefone"></i>Ligação</button><button type="button" aria-pressed="false"><i data-i="whatsapp"></i>WhatsApp</button><button type="button" aria-pressed="false"><i data-i="local"></i>Visita</button><button type="button" aria-pressed="false"><i data-i="video"></i>Reunião</button></div>
<div class="cm-pilha cm-pilha--6" style="margin-top:14px"><div class="cm-campo"><label class="cm-campo__rotulo" for="rg-p">Com quem</label><div class="cm-entrada cm-entrada--toque"><input id="rg-p" value="Marina Costa, síndica"></div></div>
<div class="cm-campo"><label class="cm-campo__rotulo" for="rg-r">Resumo</label><textarea class="cm-area" id="rg-r" rows="4">Ligação de 12 min. Quer treinar mais 20 síndicos no portal antes da assembleia de 28/10. Elogiou o atendimento do vazamento.</textarea></div>
<fieldset class="cm-grupo-opcoes cm-grupo-opcoes--linha"><legend>Como a cliente está</legend><label class="cm-radio"><input type="radio" name="hum" checked><span class="cm-radio__bola"></span><span>Satisfeita</span></label><label class="cm-radio"><input type="radio" name="hum"><span class="cm-radio__bola"></span><span>Neutra</span></label><label class="cm-radio"><input type="radio" name="hum"><span class="cm-radio__bola"></span><span>Insatisfeita</span></label></fieldset>
<label class="cm-interruptor cm-interruptor--toque"><input type="checkbox" role="switch" checked><span class="cm-interruptor__trilho"></span><span>Criar tarefa: agendar treinamento até 15/10</span></label>
<button class="cm-botao cm-botao--portal cm-botao--principal" type="button" data-toast="Contato registrado na ficha do Parque das Águas.">Registrar</button></div></div>
</main>
