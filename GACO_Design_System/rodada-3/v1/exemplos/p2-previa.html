<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fornecedores, Operações</title>
<link rel="stylesheet" href="../sistema/tokens.css">
<link rel="stylesheet" href="../sistema/base.css">
<link rel="stylesheet" href="../sistema/componentes.css">
<link rel="stylesheet" href="../sistema/extra-p2.css">
<script src="../sistema/marca.js"></script>
<style>
.p2-prev .lc-tabela tbody tr{cursor:pointer}
.p2-prev .lc-tabela-cont{border-right:0}
.p2-nota{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:var(--num)}
.p2-nota .lc-ic{width:14px;height:14px;color:var(--aviso-ponto)}
</style>
</head>
<body data-moldura='{"modulo":"operacoes","secao":"Contratos","item":"Fornecedores","papel":"operacoes"}'>
<main id="conteudo" class="lc-pagina lc-pagina--larga lc-modelo-lista p2-prev">
  <div class="lc-cab-pagina"><div class="lc-cab-pagina__txt"><h1>Fornecedores</h1><p class="lc-cab-pagina__desc">Clique numa linha para ver a prévia ao lado sem sair da lista. Setas trocam a prévia; Enter abre o fornecedor; Esc fecha.</p></div>
    <div class="lc-cab-pagina__acoes"><button class="lc-btn lc-btn--principal" type="button"><i data-i="mais"></i>Novo fornecedor</button></div></div>
  <div class="lc-filtros"><label class="lc-busca"><i data-i="pesquisar"></i><input type="search" placeholder="Nome, CNPJ ou serviço" aria-label="Pesquisar fornecedores"></label>
    <button class="lc-filtro" type="button">Serviço<i data-i="chevron-baixo"></i></button><button class="lc-filtro lc-filtro--ativo" type="button">Situação: <b>ativos</b></button>
    <div class="lc-filtros__fim"><button class="lc-btn" type="button"><i data-i="baixar"></i>Exportar</button></div></div>
  <div class="lc-modelo-previa" id="mp">
    <div class="lc-tabela-cont lc-tabela-cont--alta" id="cont"><table class="lc-tabela"><caption class="lc-sr">Fornecedores ativos, 9</caption>
      <thead><tr><th scope="col">Fornecedor</th><th scope="col">Serviço</th><th scope="col" class="lc-num">Condomínios</th><th scope="col">Avaliação</th><th scope="col">Contrato até</th></tr></thead><tbody id="tb"></tbody></table></div>
    <aside class="lc-modelo-previa__painel" id="painel" hidden aria-labelledby="pv-t"></aside>
  </div>
  <nav class="lc-paginacao" aria-label="Paginação"><span class="lc-paginacao__info"><b>1–9</b> de <b>9</b></span></nav>
</main>
<script src="../sistema/icones.js"></script>
<script src="../sistema/extra-p2-icones.js"></script>
<script src="../sistema/moldura.js"></script>
<script src="../sistema/extra-p2.js"></script>
<script>
(function(){
"use strict";
var P=LCP2,$=P.$,$$=P.$$,esc=P.esc;
var F=[["Elevadores Atlas, filial Campinas","Manutenção de elevadores","42.118.090/0002-31",18,4.6,"31/03/2027","Rogério Matos","(19) 3241-8800",["OS 482, Cond. Parque das Águas, ontem","OS 471, Edifício Atlântico, 22/09"]],
 ["Hidrotec Bombas e Reservatórios","Bombas e caixas d'água","11.902.335/0001-77",11,4.2,"30/11/2026","Sílvia Teixeira","(11) 4022-1190",["OS 479, Residencial Morada do Sol, 27/09"]],
 ["Portão Forte Automação","Portões e cancelas","27.554.810/0001-05",23,3.9,"28/02/2027","Edson Ramos","(11) 97730-4412",["OS 481, Cond. Vila Serena, 29/09","OS 466, Edifício Mirante do Vale, 18/09"]],
 ["Jardins da Serra Paisagismo","Jardinagem","09.331.276/0001-48",9,4.8,"31/01/2027","Ana Paula Moreira","(11) 3891-0045",[]],
 ["Limpa Mais Serviços","Limpeza e conservação","31.884.220/0001-63",14,4.0,"31/12/2026","Cristiano Melo","(11) 2290-7781",["OS 470, Cond. Lago Azul, 21/09"]],
 ["Segurança Alfa Monitoramento","CFTV e portaria remota","05.672.118/0001-90",16,4.4,"30/06/2027","Patrícia Gomes","(11) 3016-2200",[]],
 ["Extintores Paulista","Extintores e hidrantes","18.004.556/0001-12",31,4.7,"31/05/2027","Luiz Fernando","(11) 2201-3354",["Recarga anual, 12 condomínios, outubro"]],
 ["Dedetizadora Bem-Estar","Controle de pragas","24.119.770/0001-38",27,4.1,"31/10/2026","Márcia Duarte","(11) 4003-1188",[]],
 ["Eletro Predial Santos","Elétrica predial","33.508.441/0001-26",7,3.6,"15/12/2026","Wilson Batista","(13) 3222-4180",["OS 474, Edifício Praia Grande, 24/09"]]];
var aberto=-1;
$("#tb").innerHTML=F.map(function(f,i){ return '<tr data-i="'+i+'" tabindex="-1"><td><a class="lc-tabela__primaria" href="#" data-abrir>'+esc(f[0])+'</a><span class="lc-tabela__sub">CNPJ '+f[2]+'</span></td><td>'+f[1]+'</td><td class="lc-num">'+f[3]+'</td><td><span class="p2-nota"><i data-i="estrela"></i>'+P.num(f[4],1)+'</span></td><td>'+f[5]+'</td></tr>'; }).join("");
function previa(i,foco){
  aberto=i; var f=F[i]; $$("#tb tr").forEach(function(tr){ tr.setAttribute("aria-selected",+tr.getAttribute("data-i")===i); });
  $("#mp").setAttribute("data-previa","aberta"); var p=$("#painel"); p.hidden=false;
  p.innerHTML='<div class="lc-painel__cab"><span class="lc-ladrilho"><i data-i="fornecedor"></i></span><h2 id="pv-t" tabindex="-1">'+esc(f[0])+'</h2><span class="lc-paginador"><button class="lc-btn lc-btn--icone lc-btn--discreto" type="button" data-pv="-1" aria-label="Anterior"'+(i?'':' disabled')+'><i data-i="chevron-cima"></i></button><button class="lc-btn lc-btn--icone lc-btn--discreto" type="button" data-pv="1" aria-label="Próximo"'+(i<F.length-1?'':' disabled')+'><i data-i="chevron-baixo"></i></button></span><button class="lc-btn lc-btn--icone lc-btn--discreto" type="button" id="pv-f" aria-label="Fechar prévia"><i data-i="fechar"></i></button></div>'+
    '<div class="lc-painel__corpo"><p class="lc-legenda" style="margin-bottom:12px">Prévia só leitura, '+(i+1)+' de '+F.length+'. Para alterar, abra o fornecedor.</p>'+
    '<dl class="lc-props"><dt>Serviço</dt><dd>'+f[1]+'</dd><dt>Contato</dt><dd>'+f[6]+', '+f[7]+'</dd><dt>Atende</dt><dd>'+f[3]+' condomínios</dd><dt>Avaliação</dt><dd><span class="p2-nota"><i data-i="estrela"></i>'+P.num(f[4],1)+' de 5</span>, 38 avaliações de síndicos</dd><dt>Contrato até</dt><dd>'+f[5]+'</dd><dt>Documentos</dt><dd><span class="lc-estado lc-estado--sucesso">Certidões em dia</span></dd></dl>'+
    '<h3 class="lc-t-subsecao" style="margin:20px 0 6px">Ordens de serviço recentes</h3>'+(f[8].length?'<ul class="lc-lista">'+f[8].map(function(o){return '<li style="padding:8px 0"><i data-i="ordem-de-servico"></i>'+esc(o)+'</li>';}).join("")+'</ul>':'<p class="lc-pequeno lc-cor-2">Nenhuma ordem de serviço nos últimos 90 dias.</p>')+'</div>'+
    '<div class="lc-painel__pe"><a class="lc-btn lc-btn--p" href="#" target="_blank">Abrir em nova aba<i data-i="abrir-fora"></i></a><a class="lc-btn lc-btn--p" href="p2-criacao-rapida.html">Nova OS com ele</a><a class="lc-btn lc-btn--p lc-btn--principal" href="#">Abrir fornecedor</a></div>';
  lcIcones(p);
  $("#pv-f").addEventListener("click",fechar); $$("[data-pv]",p).forEach(function(b){ b.addEventListener("click",function(){ previa(aberto+ +b.getAttribute("data-pv"),true); }); });
  if(foco) $("#pv-t").focus();
  P.anunciar("Prévia de "+f[0]+", "+(i+1)+" de "+F.length);
}
function fechar(){ var i=aberto; aberto=-1; $("#painel").hidden=true; $("#mp").removeAttribute("data-previa"); $$("#tb tr").forEach(function(tr){ tr.removeAttribute("aria-selected"); }); var tr=$('#tb tr[data-i="'+i+'"]'); if(tr) tr.querySelector("a").focus(); }
$("#tb").addEventListener("click",function(e){ var tr=e.target.closest("tr"); if(!tr) return; e.preventDefault(); var i=+tr.getAttribute("data-i"); if(e.target.closest("[data-abrir]") && aberto===i){ P.toast("Aqui abriria a página do fornecedor.",{ic:"info"}); return; } previa(i,false); });
document.addEventListener("keydown",function(e){ if(aberto<0 || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || P.camadaAberta()) return;
  if(e.key==="ArrowDown"&&aberto<F.length-1){ e.preventDefault(); previa(aberto+1); $('#tb tr[data-i="'+aberto+'"] a').focus(); }
  if(e.key==="ArrowUp"&&aberto>0){ e.preventDefault(); previa(aberto-1); $('#tb tr[data-i="'+aberto+'"] a').focus(); }
  if(e.key==="Escape"&&!document.querySelector(".lc-menu,.lc-cmdk,.lc-popover")){ e.preventDefault(); fechar(); } });
if(new URLSearchParams(location.search).get("aberto")!=="nao") previa(0,false);
})();
</script>
</body>
</html>
